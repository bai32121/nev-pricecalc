name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "车价计算器.html"
      - ".github/workflows/ios-ipa.yml"

jobs:
  ipa:
    name: iOS 未签名 IPA
    # 不要用 macos-14：该镜像已进入退役周期，job 会分配不到机器并被秒取消
    # （表现是 run 创建后 1 秒变 cancelled，runner_name 为空、没有任何 step 执行）。
    # macos-15 自带 Xcode 16，能读 objectVersion 56/77 两种工程格式。
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write   # 创建 Release 需要
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 构建
        run: |
          chmod +x ios/build.sh
          cd ios
          ./build.sh

      - name: 上传产物（需登录才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: NEVPriceCalc-unsigned-ipa
          path: ios/build/NEVPriceCalc-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # 手机上直接点链接就能下，TrollStore 会接手安装；
      # Artifact 那条路要登录 + 解压，在手机上很难受
      - name: 发布到 Release（手机可直接下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest ios/build/NEVPriceCalc-unsigned.ipa \
            --title "iOS 未签名 IPA（TrollStore 直接装）" \
            --notes "未签名包，TrollStore 里打开即可永久安装。适用于 iOS 14.0–17.0。"
